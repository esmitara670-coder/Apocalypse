name: Render Reel

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Remotion & Voice Engine
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install edge-tts --break-system-packages
          npm install

      - name: Generate Hindi Voice & Auto-Sync Captions
        run: |
          python3 - << 'EOF'
          import os, re, subprocess

          os.makedirs("public", exist_ok=True)
          with open("src/Root.tsx", "r", encoding="utf-8") as f:
              code = f.read()

          voice_match = re.search(r'VOICE\s*=\s*["\']([^"\']+)["\']', code)
          voice = voice_match.group(1) if voice_match else "hi-IN-MadhurNeural"

          pattern = r'(start:\s*(\d+(?:\.\d+)?)\s*,\s*duration:\s*(\d+(?:\.\d+)?)\s*,\s*speechDur:\s*)(\d+(?:\.\d+)?)(\s*,\s*caption:\s*"[^"]+"\s*,\s*tts:\s*"([^"]+)")'
          matches = list(re.finditer(pattern, code))

          if not matches:
              subprocess.run(["edge-tts", "--voice", voice, "--text", "नमस्ते", "--write-media", "public/voice.mp3"], check=True)
          else:
              fixed_clips = []
              new_code = code
              offset = 0

              for i, m in enumerate(matches):
                  dur_f = float(m.group(3))
                  spoken_text = m.group(6)
                  raw_clip = f"raw_{i}.mp3"
                  trim_clip = f"trim_{i}.wav"
                  fixed_clip = f"fixed_{i}.wav"

                  subprocess.run([
                      "edge-tts",
                      "--voice", voice,
                      "--rate=+0%",
                      "--pitch=-2Hz",
                      "--text", spoken_text,
                      "--write-media", raw_clip
                  ], check=True)

                  subprocess.run([
                      "ffmpeg", "-y", "-i", raw_clip,
                      "-af", "silenceremove=start_periods=1:start_silence=0.04:start_threshold=-45dB,areverse,silenceremove=start_periods=1:start_silence=0.04:start_threshold=-45dB,areverse",
                      trim_clip
                  ], check=True)

                  probe = subprocess.run([
                      "ffprobe", "-v", "error", "-show_entries", "format=duration",
                      "-of", "default=noprint_wrappers=1:nokey=1", trim_clip
                  ], capture_output=True, text=True, check=True)
                  clip_dur = float(probe.stdout.strip() or (dur_f - 0.4))

                  max_allowed = dur_f - 0.25
                  if clip_dur > max_allowed:
                      tempo = min(1.35, max(1.0, clip_dur / max_allowed))
                      actual_speech_dur = clip_dur / tempo
                      af = f"atempo={tempo:.3f},apad=whole_dur={dur_f},atrim=0:{dur_f}"
                  else:
                      actual_speech_dur = clip_dur
                      af = f"apad=whole_dur={dur_f},atrim=0:{dur_f}"

                  subprocess.run([
                      "ffmpeg", "-y", "-i", trim_clip,
                      "-af", af, "-ar", "44100", "-ac", "2", fixed_clip
                  ], check=True)
                  fixed_clips.append(fixed_clip)

                  start_idx = m.start(4) + offset
                  end_idx = m.end(4) + offset
                  replacement = f"{actual_speech_dur:.2f}"
                  new_code = new_code[:start_idx] + replacement + new_code[end_idx:]
                  offset += len(replacement) - (m.end(4) - m.start(4))

              with open("src/Root.tsx", "w", encoding="utf-8") as f:
                  f.write(new_code)

              inputs = []
              for fc in fixed_clips:
                  inputs.extend(["-i", fc])
              concat_filter = "".join(f"[{i}:a]" for i in range(len(fixed_clips))) + f"concat=n={len(fixed_clips)}:v=0:a=1[out]"
              subprocess.run(["ffmpeg", "-y"] + inputs + ["-filter_complex", concat_filter, "-map", "[out]", "public/voice.mp3"], check=True)
          EOF

      - name: Render 1080p 60FPS MP4
        run: npx remotion render Reel Out.mp4 --codec=h264

      - name: Upload Final Video
        uses: actions/upload-artifact@v4
        with:
          name: Final-Reel-MP4
          path: Out.mp4
