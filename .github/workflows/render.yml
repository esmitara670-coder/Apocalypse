name: Render Remotion Video

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fix Ubuntu 24.04 Chrome Sandbox & Install Deps
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx -y playwright install-deps chromium
          npm install --legacy-peer-deps

      - name: Render 1080p MP4
        run: |
          npx remotion render src/Root.tsx Reel out.mp4 --codec=h264 --concurrency=2 --jpeg-quality=85 --crf=20

      - name: Upload Final Video
        uses: actions/upload-artifact@v4
        with:
          name: Final-Rendered-Video
          path: out.mp4
