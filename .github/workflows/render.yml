name: Render Reel

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Remotion & Voice Engine
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install edge-tts --break-system-packages
          npm install

      - name: Generate Hindi Voice & Auto-Sync Captions
        run: |
          python3 - << 'EOF'
          import os, re, subprocess

          os.makedirs("public", exist_ok=True)
          with open("src/Root.tsx", "r", encoding="utf-8") as f:
              code = f.read()

          voice = "hi-IN-MadhurNeural"
          scenes = re.findall(r'duration:\s*(\d+(?:\.\d+)?)[^\n]*?(?:tts|text):\s*["\']([^"\']+)["\']', code)

          if not scenes:
              subprocess.run(["edge-tts", "--voice", voice, "--text", "Namaste dosto", "--write-media", "public/voice.mp3"], check=True)
          else:
              clips = []
              speech_durs = []
              for i, (dur_s, txt) in enumerate(scenes):
                  dur = float(dur_s)
                  raw = f"raw_{i}.mp3"
                  wav = f"fixed_{i}.wav"
                  subprocess.run(["edge-tts", "--voice", voice, "--text", txt, "--write-media", raw], check=True)

                  out = subprocess.run(
                      ["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "default=noprint_wrappers=1:nokey=1", raw],
                      capture_output=True, text=True
                  ).stdout.strip()
                  try:
                      cdur = float(out)
                  except:
                      cdur = dur - 0.5

                  max_d = dur - 0.2
                  if cdur > max_d and max_d > 0:
                      spd = min(1.35, max(1.0, cdur / max_d))
                      sdur = cdur / spd
                      af = f"atempo={spd:.3f},apad=whole_dur={dur},atrim=0:{dur}"
                  else:
                      sdur = max(1.0, cdur - 0.15)
                      af = f"apad=whole_dur={dur},atrim=0:{dur}"

                  speech_durs.append(sdur)
                  subprocess.run(["ffmpeg", "-y", "-i", raw, "-af", af, "-ar", "44100", "-ac", "2", wav], check=True)
                  clips.append(wav)

              idx = 0
              def repl(m):
                  global idx
                  val = speech_durs[idx] if idx < len(speech_durs) else 3.8
                  idx += 1
                  return f"speechDur: {val:.2f}"

              new_code = re.sub(r'speechDur:\s*\d+(?:\.\d+)?', repl, code)
              with open("src/Root.tsx", "w", encoding="utf-8") as f:
                  f.write(new_code)

              inputs = []
              for c in clips:
                  inputs.extend(["-i", c])
              cf = "".join(f"[{i}:a]" for i in range(len(clips))) + f"concat=n={len(clips)}:v=0:a=1[out]"
              subprocess.run(["ffmpeg", "-y"] + inputs + ["-filter_complex", cf, "-map", "[out]", "public/voice.mp3"], check=True)
          EOF

      - name: Render 1080p 60FPS MP4
        run: npx remotion render Reel Out.mp4 --codec=h264

      - name: Upload Final Video
        uses: actions/upload-artifact@v4
        with:
          name: Final-Reel-MP4
          path: Out.mp4
